model:
  name: Qwen/Qwen2.5-3B-Instruct
  max_seq_length: 1536
  attn_implementation: sdpa
  use_qlora: false
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

train:
  output_dir: outputs/vulgar-en-lora-3b
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: cosine
  logging_steps: 10
  save_strategy: epoch
  eval_strategy: epoch
  save_total_limit: 2
  seed: 42
  gradient_checkpointing: true
  optim: adamw_torch_fused
  max_grad_norm: 1.0
  dataloader_num_workers: 4
  report_to: none

data:
  processed_dir: data/processed
  train_file: data/processed/train.jsonl
  eval_file: data/processed/eval.jsonl
  test_file: data/processed/test.jsonl
  labeled_file: data/raw/labeled.jsonl
  include_seed: true
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42

infer:
  adapter_dir: outputs/vulgar-en-lora-3b
  max_new_tokens: 256
  temperature: 0.0
  top_p: 1.0
